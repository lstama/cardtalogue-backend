# Memory settings for low RAM environments

shared_buffers = 64MB             # Postgres' main cache, typically 1/4 to 1/8 of RAM
work_mem = 4MB                    # Memory for sorting operations per query
maintenance_work_mem = 16MB       # Memory for maintenance operations like vacuum
effective_cache_size = 128MB      # Estimate of OS disk cache available
max_connections = 20              # Limit connections to reduce memory pressure

# Other recommended settings to reduce resource usage

wal_buffers = 4MB
checkpoint_completion_target = 0.9
default_statistics_target = 50

# Logging (optional, can help with debugging)
log_min_duration_statement = 5000
