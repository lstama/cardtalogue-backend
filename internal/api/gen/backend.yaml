components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /auth/login, sent in the Authorization header.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (default 100, max 1000)
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 100
    Offset:
      name: offset
      in: query
      required: false
      description: Pagination offset (default 0)
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Id:
      name: id
      in: path
      required: true
      description: Numeric resource id
      schema:
        type: integer
        format: uint32
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
      examples:
        - error: "media not found"
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        access_token:
          type: string
        refresh_token:
          type: string
      examples:
        - user:
            $ref: '#/components/schemas/UserResponse'
          access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example"
          refresh_token: "0a1b2c3d4e5f60718293a4b5c6d7e8f9"
    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    RefreshTokenResponse:
      type: object
      properties:
        access_token:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: uint32
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - admin
            - editor
        age:
          type: integer
          minimum: 1
          maximum: 150
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      examples:
        - id: 1
          name: "Alice"
          email: "alice@example.com"
          role: editor
          age: 30
          created_at: "2024-01-01T00:00:00Z"
          updated_at: "2024-06-01T00:00:00Z"
    CreateUserRequest:
      type: object
      required:
        - name
        - email
        - password
        - role
        - age
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 100
        role:
          type: string
          enum:
            - admin
            - editor
        age:
          type: integer
          minimum: 1
          maximum: 150
    UpdateUserRequest:
