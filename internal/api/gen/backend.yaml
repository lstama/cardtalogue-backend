  /media/scan:
    post:
      tags:
        - media
      security:
        - bearerAuth: []
      summary: |
        Recognize a card from an uploaded image. Requires a valid JWT and a CAPTCHA token (X-Cap-Token) when CAPTCHA_MODE=on. Multipart field: file.
      description: "Upload an image and return card matches with confidence scores."
      operationId: scanMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaScanResponse'
          description: 200 response
        '400':
          description: Bad request (missing file / captcha)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
