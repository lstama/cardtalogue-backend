openapi: 3.1.0
info:
  title: Cardtalogue Backend API
  description: |
    Contract for the Cardtalogue Go/Gin backend. This is a snapshot of current behavior (see DISCREPANCIES.md in the parent repo). The frontend adopts the subset of these endpoints it calls; the full surface is documented here.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Authentication
  - name: cards
    description: Card catalog
  - name: protected-cards
    description: Authenticated user's own cards
  - name: games
    description: Game definitions
  - name: languages
    description: Language definitions
  - name: packs
    description: Pack definitions
  - name: rarities
    description: Rarity definitions
  - name: storages
    description: User storages
  - name: users
    description: User management
  - name: media
    description: Media upload / scan
paths:
  /health:
    get:
      tags:
        - media
      security: []
      summary: Health check
      description: "Check backend health and readiness."
      operationId: health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
        '503':
          $ref: '#/components/responses/ServerError'
  /auth/login:
    post:
      tags:
        - auth
      security: []
      summary: Log in
      description: "Authenticate a user with email and password, returning access and refresh tokens."
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: 200 response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags:
        - auth
      security: []
      summary: Refresh access token
      description: "Exchange a valid refresh token for a new access token."
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
          description: 200 response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
        - auth
      security: []
      summary: Invalidate the refresh token (read from X-Refresh-Token header)
      description: "Invalidate the current refresh token and sign the user out."
      operationId: logout
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: logged out
        '400':
          $ref: '#/components/responses/BadRequest'
  /cards:
    get:
      tags:
        - cards
      summary: List cards
      description: "List cards, with optional filtering, pagination, and sorting."
      operationId: getCards
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardResponse'
          description: 200 response
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - cards
      summary: Create a card (owner)
      description: "Create a new card in a game."
      operationId: createCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
          description: 200 response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cards/search:
    get:
      tags:
        - cards
      summary: Search cards
      description: "Search cards by name or code within a game."
      operationId: searchCards
      parameters:
        - name: game_id
          in: query
          required: false
          schema:
            type: integer
            format: uint32
        - name: language_id
          in: query
          required: false
          schema:
            type: integer
            format: uint32
        - name: pack_id
          in: query
          required: false
          schema:
            type: integer
            format: uint32
        - name: query
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardResponse'
          description: 200 response
        '500':
          $ref: '#/components/responses/ServerError'
  /cards/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - cards
      summary: Get a card by id
      description: "Retrieve a single card by id."
      operationId: getCardById
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
          description: 200 response
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - cards
      summary: Update a card (owner)
      description: "Update a card owned by the authenticated user."
      operationId: updateCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardRequest'
      responses:
