version: '3.8'

services:
  postgres:
    image: docker.io/postgres:15
    # Postgres credentials are read from the environment; defaults shown below.
    # Override by exporting POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardtalogue}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dbname"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
