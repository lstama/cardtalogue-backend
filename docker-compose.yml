version: '3.8'

services:
  postgres:
    image: docker.io/postgres:15
    # Postgres credentials are read from the environment; defaults shown below.
    # Override by exporting POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardtalogue}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dbname"]
      interval: 30s
      timeout: 10s
      retries: 5

  # API backend. Exposes /metrics on :9090 (OTEL_METRICS_ADDRESS/PORT) and the
  # OTLP HTTP exporter on :4318 for traces + metrics.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Ports are read from the environment; defaults match the otel package.
    ports:
      - "${API_PORT:-8080}:8080"
      - "${OTEL_METRICS_PORT:-9090}:9090"
      - "4318:4318"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cardtalogue?sslmode=disable
      PORT: "8080"
      MIGRATIONS_PATH: file://migrations
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      GIN_MODE: ${GIN_MODE:-debug}
      OTEL_SERVICE_NAME: cardtalogue-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://prometheus:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_METRICS_ADDRESS: 0.0.0.0
      OTEL_METRICS_PORT: "9090"
      OTEL_RESOURCE_ATTRIBUTES: service.version=0.1.0
      OTEL_BSP_SCHEDULE_DELAY: "5000"
      OTEL_BSP_MAX_QUEUE_SIZE: "2048"
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "512"
    depends_on:
      postgres:
        condition: service_healthy

  # Prometheus: scrapes the API /metrics endpoint and receives OTLP metrics.
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/data
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/data
      - --web.listen-address=0.0.0.0:9090
    depends_on:
      - api

  # Grafana all-in-one: preconfigured to read from the Prometheus datasource.
  grafana:
    image: grafana/grafana-all-in-one:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
